[tool.poetry]
name = "py_kgfix_ror"
version = "0.1.0"
description = "Utilities for processing ROR data"
authors = ["antoinprovain@gmail.com"]
packages = [{include = "py_kgfix_ror", from = "src"}]  

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.31.0"
pysema = { git = "https://github.com/vliz-be-opsci/py-sema.git" }
jsonschema = "^4.20.0"

[tool.poetry.group.test.dependencies] 
pytest = "^7.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
flake8 = "^6.0.0"
isort = "^5.12.0"
types-requests = "^2.32.4.20250913"
types-jsonschema = "^4.25.1.20251009"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"